<div class="container-fluid py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div>
      <h1 class="h4 fw-bold mb-1">Consulta de iniciativas</h1>
      <p class="text-muted mb-0">Búsqueda y recuperación de información legislativa.</p>
    </div>
    <a routerLink="/iniciativas/crear" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Nueva iniciativa</a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3 gap-2">
        <input
          type="text"
          class="form-control"
          style="max-width:320px"
          placeholder="Buscar por número, título, tema..."
          (input)="onSearch($any($event.target).value)">
        <span class="text-muted small">{{ totalCount() }} iniciativa(s)</span>
      </div>

      <ag-grid-angular
        style="width:100%;height:560px"
        [theme]="theme"
        [rowData]="rowData()"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [localeText]="localeText"
        [pagination]="true"
        [paginationPageSize]="20"
        (gridReady)="onGridReady($event)"
        (cellClicked)="onCellClicked($event)">
      </ag-grid-angular>
    </div>
  </div>
</div>
